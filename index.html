<style>
  :root{
    --bg:#060b17; --card:#0e1730; --line:#1c2a4d; --text:#f2f5ff; --muted:#8a96b8; --accent:#4f8cff;
  }
  *{box-sizing:border-box;margin:0}
  body{
    min-height:100vh; background:var(--bg); color:var(--text);
    font-family:Inter,system-ui,sans-serif;
    display:flex; justify-content:center; padding:48px 20px;
  }
  main{width:100%; max-width:420px}
  header{margin-bottom:32px}
  .tag{font-family:"JetBrains Mono",monospace; font-size:13px; color:var(--accent); margin-bottom:10px}
  h1{font-family:"JetBrains Mono",monospace; font-size:32px; line-height:1.15}
  header p{color:var(--muted); margin-top:10px; line-height:1.5}
  .links{display:flex; flex-direction:column; gap:12px}
  a.link{
    display:flex; align-items:center; gap:16px; padding:18px;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    color:var(--text); text-decoration:none; transition:border-color .15s;
  }
  a.link:hover{border-color:var(--accent)}
  a.link:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
  .icon{
    flex:none; width:44px; height:44px; border-radius:8px; background:#0a1226;
    display:grid; place-items:center; color:var(--accent);
  }
  .icon svg{width:22px; height:22px}
  .txt strong{display:block; font-weight:600; font-size:16px}
  .txt span{display:block; color:var(--muted); font-size:14px; margin-top:2px}
  a.wa{background:var(--accent); border-color:var(--accent); color:#fff}
  a.wa .icon{background:rgba(255,255,255,.18); color:#fff}
  a.wa .txt span{color:rgba(255,255,255,.85)}
  a.wa:hover{border-color:#fff}
  footer{margin-top:32px; font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--muted)}
</style>
</head>
